modelRoles:
  default: commandcode/deepseek/deepseek-v4.1-flash:high
  slow: commandcode/z-ai/glm-5.3-flash:high
  plan: commandcode/zai-org/GLM-5.3:high
  advisor: commandcode/deepseek/deepseek-v4.1-flash
  designer: commandcode/xiaomi/mimo-v2.6-pro
  task: commandcode/deepseek/deepseek-v4.1-flash
  smol: commandcode/xiaomi/mimo-v2.6-flash
  tiny: commandcode/xiaomi/mimo-v2.6-flash
  commit: commandcode/xiaomi/mimo-v2.6-flash
  vision: commandcode/z-ai/glm-5.3-flash:low
modelPresets:
  commandcode:
    modelRoles:
      default: commandcode/deepseek/deepseek-v4.1-flash:high
      slow: commandcode/deepseek/deepseek-v4.1-flash:max
      plan: commandcode/z-ai/glm-5.3-flash:high
      advisor: commandcode/deepseek/deepseek-v4.1-flash
      designer: commandcode/xiaomi/mimo-v2.6-pro
      task: commandcode/deepseek/deepseek-v4.1-flash
      smol: commandcode/xiaomi/mimo-v2.6-flash
      tiny: commandcode/xiaomi/mimo-v2.6-flash
      commit: commandcode/xiaomi/mimo-v2.6-flash
      vision: commandcode/xiaomi/mimo-v2.6-flash
  # commandcode open-weight workhorses + one closed OpenAI GPT for planning/review
  # (reviewer.md routes model: "@plan"). openai-codex is the only reachable OpenAI
  # route — the pay-per-token `openai` provider has no credential here.
  commandcode-openai:
    modelRoles:
      default: commandcode/deepseek/deepseek-v4.1-flash:high
      slow: openai-codex/gpt-6.1-sol:medium
      plan: openai-codex/gpt-6.1-sol:high
      advisor: commandcode/deepseek/deepseek-v4.1-flash
      designer: commandcode/xiaomi/mimo-v2.6-pro
      task: commandcode/deepseek/deepseek-v4.1-flash
      smol: commandcode/xiaomi/mimo-v2.6-flash
      tiny: commandcode/xiaomi/mimo-v2.6-flash
      commit: commandcode/xiaomi/mimo-v2.6-flash
      vision: commandcode/xiaomi/mimo-v2.6-flash
  opencode-go:
    modelRoles:
      default: opencode-go/deepseek-v4.1-flash:high
      slow: opencode-go/glm-5.3-flash:high
      plan: opencode-go/glm-5.3:high
      advisor: opencode-go/deepseek-v4.1-flash
      designer: opencode-go/mimo-v2.6-pro
      task: opencode-go/deepseek-v4.1-flash
      smol: opencode-go/mimo-v2.6-flash:low
      tiny: opencode-go/mimo-v2.6-flash:low
      commit: opencode-go/mimo-v2.6-flash:low
      vision: opencode-go/glm-5.3-flash:low
  openai-codex:
    modelRoles:
      default: openai-codex/gpt-6-luna:high
      slow: openai-codex/gpt-6.1-sol:high
      plan: openai-codex/gpt-6.1-sol:high
      advisor: openai-codex/gpt-6.1-sol:high
      designer: openai-codex/gpt-6.1-sol:high
      task: openai-codex/gpt-6-luna:high
      smol: openai-codex/gpt-6-luna:low
      tiny: openai-codex/gpt-6-luna:low
      commit: openai-codex/gpt-6-luna:low
      vision: openai-codex/gpt-6-luna:low
    defaultThinkingLevel: high
task:
  maxConcurrency: 4
  maxRecursionDepth: 2
setupVersion: 2
hideThinkingBlock: false
theme:
  dark: dark
composer:
  shape: band
  tokenRate: true
statusLine:
  preset: nerd
  separator: powerline
  contextLine: embedded
  sessionAccent: true
  transparent: false
  compactThinkingLevel: true
  showHookStatus: true
tui:
  textSizing: false
  resizeScrollback: rebuild
omitThinking: false
defaultThinkingLevel: auto
display:
  shimmer: classic
  showTokenUsage: true
  showTurnTime: true
  cacheMissMarker: true
  pinnedAgents: full
  subagentLivePreview: true
bash:
  enabled: true
memory:
  backend: "off"
memories:
  enabled: false
